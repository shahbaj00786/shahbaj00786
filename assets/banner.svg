<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Shahbaj Hussain, Full Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09111f"/>
      <stop offset="0.6" stop-color="#12203a"/>
      <stop offset="1" stop-color="#1f3355"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc83d"/>
      <stop offset="1" stop-color="#35d9c0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#93a4be" fill-opacity="0.22"/>
    </pattern>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#ffc83d" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffc83d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="18" fill="url(#dots)"/>
  <rect width="1200" height="260" rx="18" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="258.5" rx="17.5" fill="none" stroke="#22344f" stroke-width="1.5"/>

  <!-- SH monogram -->
  <rect x="80" y="30" width="60" height="60" rx="14" fill="#ffc83d"/>
  <text x="110" y="70" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#09111f">SH</text>

  <text x="164" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#35d9c0">Open to full-time roles</text>
  <circle cx="154" cy="61" r="4.5" fill="#35d9c0"/>

  <text x="80" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffc83d">Shahbaj Hussain</text>
  <rect x="82" y="188" width="90" height="5" rx="2.5" fill="url(#bar)"/>

  <text x="80" y="228" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#e8eef7">Full Stack Developer  |  MERN Stack  |  OpenAI &amp; Socket.io  |  650+ DSA</text>
